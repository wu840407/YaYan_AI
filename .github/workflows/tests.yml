name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # same as the deployment

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Byte-compile every Python file
        run: python -m compileall -q .

      - name: Unit tests
        run: python -m pytest
